# tmux session config
# format:
#   session: name
#   dir: ~/default/path (optional, defaults to ~)
#   window: name
#   window: name | dir=/override/path
#   window: name | cmd=some command
#   window: name | dir=/path | cmd=some command

session: work
dir: ~/workspace
window: terminal
window: dotfiles | dir=~/workspace/dot_files
