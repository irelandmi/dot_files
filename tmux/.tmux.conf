# ── Prefix ──
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000
set -g focus-events on

# ── Vi mode ──
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Splits ──
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind W split-window -h -c "#{pane_current_path}" \; \
     split-window -h -c "#{pane_current_path}" \; \
     select-layout even-horizontal \; \
     resize-pane -t 1 -x 15% \; \
     resize-pane -t 3 -x 15% \; \
     select-pane -t 2

# Switch panes using Alt + Vim keys without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Resize ──
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status bar (Glacier-inspired) ──
set -g status-position top
set -g status-style "#{?client_prefix,bg=#bd0f2f fg=#ffffff bold,bg=#1f5872 fg=#a0b6d3}"
set -g status-left-length 40
set -g status-right-length 50
set -g status-left "#{?client_prefix, PREFIX │ ,#[fg=#49e998,bold] #S #[fg=#a0b6d3]│ }"
set -g status-right "#[fg=#a0b6d3]│ %H:%M │ %d %b"
set -g status-justify left

# ── Window tabs ──
setw -g window-status-format "#[fg=#0c1115] #I:#W "
setw -g window-status-current-format "#[fg=#49e998,bold] #I:#W "

# ── Pane borders ──
set -g pane-border-style "fg=#2e343c"
set -g pane-active-border-style "fg=#1f5872"

# copy to system clipboard
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"


